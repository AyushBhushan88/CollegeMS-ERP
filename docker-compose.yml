      - RABBITMQ_URL=amqp://campuscore:campuscore_password@rabbitmq:5672
      - PORT=3006
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
    depends_on:
      - postgres
      - rabbitmq
      - mailhog

  grievance-service:
