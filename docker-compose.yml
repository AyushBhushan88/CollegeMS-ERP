      - rabbitmq

  finance-service:
    build:
      context: .
      dockerfile: services/finance-service/Dockerfile
    container_name: campuscore-finance-service
    ports:
      - "3003:3003"
    environment:
      - DATABASE_URL=postgresql://campuscore:campuscore_password@postgres:5432/campuscore_erp?schema=public
      - RABBITMQ_URL=amqp://campuscore:campuscore_password@rabbitmq:5672
      - PORT=3003
      - RAZORPAY_KEY_ID=your_key_id
      - RAZORPAY_KEY_SECRET=your_key_secret
    depends_on:
      - postgres
      - rabbitmq

  communication-service:
    build:
      context: .
      dockerfile: services/communication-service/Dockerfile
    container_name: campuscore-communication-service
    ports:
      - "3006:3006"
